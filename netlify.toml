[[redirects]]
  from = "/*"
  to = "/"
  status = 200 

[[headers]]
  for = "/*.js"
  [headers.values]
    Content-Type = "text/javascript"

[[headers]]
  for = "/*.mjs"
  [headers.values]
    Content-Type = "text/javascript"

[[headers]]
  for = "/*.tsx"
  [headers.values]
    Content-Type = "text/javascript"
    
[[headers]]
  for = "/*.ts"
  [headers.values]
    Content-Type = "text/javascript" 